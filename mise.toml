[tools]
node = "26"
pnpm = "10"
fnox = "1"

# Plaintext local defaults. Only real secrets belong in fnox.toml.
#
# No HUB_URL here, and none in a task's `env` either (#376, #385). This block is
# ambient: it reaches every process born in an activated checkout, and an
# endpoint is not something two sources may disagree about. There is exactly one
# authority for it — this machine's config.json, written by `ub init` and
# `ub remote join` — and the tasks below consume it by wrapping their command in
# `ub env`, which hands over the same environment `ub mcp serve` gives the MCP
# server. A checkout is not a configuration layer of its own.
#
# The hub itself binds HUB_HOST:PORT — default 127.0.0.1:1234 in code — and
# never reads HUB_URL, so the two must be moved together when the hub runs
# somewhere else. The bind address is loopback until someone opts into more: the
# hub's only credential is a shared dev secret, so `HUB_HOST=0.0.0.0` is a
# deliberate choice.
[env]

# The hub's SQLite file, checkout-local and gitignored. Absent this, a hub opens
# the *packaged user's* database — `$XDG_DATA_HOME/uberblick/hub.sqlite`, or
# `~/.local/share/uberblick/hub.sqlite`, the one layout on every platform
# (#385) — and development has no business writing there. Every mise path
# inherits it: `mise run hub`, `mise run dev`, `mise run e2e` (whose harness
# goes further and starts its hub on a temp database of its own). The Docker
# review container does not — it runs `pnpm` directly and mise never executes
# there — and needs nothing: no suite opens a default database.
HUB_DB_PATH = "{{config_root}}/packages/hub/data/hub.sqlite"

# `ub` and `uberblick` as plain commands inside the checkout. pnpm links the
# cli package's declared bin entries here on install (the root package.json
# depends on it for exactly that reason); mise prepends this directory for any
# activated shell in the checkout and for every `mise run`/`mise exec`, and
# drops it again on leaving. Nothing is installed outside the checkout —
# distribution is a separate concern.
_.path = ["{{config_root}}/node_modules/.bin"]

# The contributor quick-start, once per checkout entry. `enter` fires when this
# config becomes active, not on every `cd` inside it, and only for a shell with
# `mise activate` — shims alone never run hooks. The script decides whether to
# say anything at all; see its header.
[hooks]
enter = { run = 'sh "{{config_root}}/scripts/mise-welcome.sh"' }

[tasks.welcome]
description = "Show the contributor quick-start"
# `quiet` keeps mise's own "[welcome] $ sh ..." banner off the output, so the
# hook and the task print the same thing.
quiet = true
run = 'sh "{{config_root}}/scripts/mise-welcome.sh"'

[tasks.setup]
description = "Fresh checkout to running: pinned toolchain, frozen dependencies, then `ub init`"
# The fresh-checkout entry point, and a superset of `ub init` rather than a
# synonym for it: everything here runs from TypeScript source through `tsx`, so
# `ub` needs Node, pnpm and a completed install before it executes a line.
#
# Each step is a nested `mise run`, which re-resolves the tool paths — `mise
# install` on line one may be what put node and pnpm there in the first place.
#
# mise appends a task's arguments to the LAST line of its script, so
# `mise run setup -- --yes` becomes `mise run init -- --yes` here and
# `ub init --yes` in `init` below. Keep the hand-off last.
run = """
mise install
mise run install
mise run init --
"""

[tasks.init]
description = "Identity, workspace and a local development signing secret (`ub init`)"
# Through `fnox exec` so that on the owner's machine the decryptable
# HUB_AUTH_TOKEN is visible: `ub init` generates a secret only when nobody else
# supplies one, and fnox is somebody else. Without the age key this warns and
# `ub init` generates its own.
run = "fnox exec --if-missing warn -- node packages/cli/bin/ub.mjs init"

[tasks.hub]
description = "Start the Hocuspocus sync hub (binds HUB_HOST:PORT, default 127.0.0.1:1234)"
# `ub env --` puts this machine's own configuration in front of the command:
# WORKSPACE_ID, the endpoint and the signing secret, resolved exactly as
# `ub mcp serve` resolves them for the MCP server. `fnox exec` stays outside it,
# because a decryptable HUB_AUTH_TOKEN is the owner's path and outranks the
# stored one.
run = "fnox exec --if-missing warn -- ub env -- pnpm --filter @uberblick/hub start"

[tasks.mcp]
description = "Start the MCP server for a smoke test — an MCP client normally spawns it over stdio itself"
# --silent keeps pnpm's own lifecycle banner off stdout: stdout is the JSON-RPC
# transport, so anything but MCP frames there breaks the session.
run = "fnox exec --if-missing warn -- ub env -- pnpm --silent --filter @uberblick/mcp-server start"

[tasks.web]
description = "Start the Vite dev server"
# Through `ub env` like the hub: the endpoint the bundle dials is this machine's
# configured one, so a checkout follows a `ub remote join` without anything
# being written into it.
#
# The dev server serves this environment — the signing secret included — at
# /uberblick-config.json (#426, packages/web/dev-config-document.ts). `vite`
# binds loopback; adding `--host` would publish the owner's own secret to
# everything on the LAN, which is acceptable only inside the tailnet boundary
# REMOTE.md records.
run = "fnox exec --if-missing warn -- ub env -- pnpm --filter @uberblick/web dev"

[tasks.build-web]
description = "Build the web client into packages/web/dist (no secret in the bundle; HUB_URL only as the fallback)"
# `--if-missing warn`, not `error`: since #426 the build needs no secret at all,
# so a contributor without the age key builds the same bundle the deployment
# does.
run = "fnox exec --if-missing warn -- ub env -- pnpm --filter @uberblick/web build"

# hub + web only. The MCP server is a stdio process spawned by its client
# (Claude Code et al.), so it is not part of the dev loop; use `mise run mcp`
# for a standalone smoke test.
#
# These are long-running, so `depends` is wrong here: with MISE_JOBS=1 mise
# would run the hub to completion before ever starting web. Fan out explicitly
# instead, and take the whole process group down on Ctrl-C. Both halves reach
# `ub env` through the tasks they delegate to.
[tasks.dev]
description = "Run the hub and the web dev server together"
run = """
mise run hub &
mise run web &
trap 'kill 0' INT TERM
wait
"""

[tasks.agent-cursor]
description = "Park a demo agent cursor in a document's first block (optional `-- <docUuid>`)"
run = "fnox exec --if-missing warn -- ub env -- pnpm --filter @uberblick/web run agent-cursor"

[tasks.install]
description = "Install workspace dependencies (frozen lockfile in CI)"
# PNPM_STORE_DIR is a convention of this task, not something pnpm reads: CI sets
# it to the store it caches, and pnpm expands the `~` itself. Unset locally, so
# pnpm keeps using its own default store.
run = 'pnpm install --frozen-lockfile ${PNPM_STORE_DIR:+--store-dir "$PNPM_STORE_DIR"}'

[tasks.lint]
description = "Lint the workspace with Biome (lint only — the formatter stays off)"
# Biome is one root-level binary, not a per-package script, so this is `pnpm
# lint` rather than `pnpm -r lint`. The root script carries the flags so the
# Docker review runs the identical command.
run = "pnpm lint"

[tasks.typecheck]
description = "Typecheck every package (tsc --noEmit)"
run = "pnpm -r typecheck"

[tasks.test]
description = "Run all test suites"
# `pnpm test` rather than `pnpm -r test`, for the same reason as lint above: the
# root script is the one command, so the Docker review runs it identically. It
# chains the workspace fan-out with the issue-preparation protocol, agent-role
# and housekeeping suites outside `packages/*`, which `pnpm -r` cannot reach —
# `pnpm-workspace.yaml` globs `packages/*` only.
run = "pnpm test"

[tasks.spike-shared-owner]
description = "Run the disposable shared workspace owner architecture spike (#621)"
run = "pnpm --filter @uberblick/mcp-server exec tsx spike/shared-owner.ts"

[tasks.check-agents]
description = "Check role triplets and provider-neutral issue-authoring wiring"
# Portability invariants only, never the contracts' prose — see the script's
# header for what a green run does not claim. It is chained into `mise run test`
# as well, so the gates enforce it without anyone remembering this task; run it
# directly while editing a role.
#
# `.claude/agents` is absent from the immutable review image (`.dockerignore`
# re-admits only `.claude/skills/**`), so the script skips that third loudly
# there and CI is what enforces it.
run = "node scripts/check-agent-roles.mjs"

[tasks.e2e]
description = "Run the browser end-to-end proof points (Playwright, Chromium only)"
# The harness starts its own hub on an ephemeral port with its own throwaway
# signing secret and a temp database, so nothing here needs the real one — and
# nothing collides with a `mise run dev` on 1234/5173. It runs under the same
# `fnox exec -- ub env --` wrapper as every other task all the same, so there is
# one way a checkout task gets its environment; the harness sets its own
# endpoint over it, which is test wiring rather than configuration (#283).
#
# `playwright install` runs first because the browser is a download, not a
# dependency pnpm can fetch: it is a no-op once the pinned Chromium is in the
# local cache, and the alternative is a first run that fails with instructions.
run = 'sh "{{config_root}}/scripts/run-e2e.sh"'

[tasks.fue]
description = "First-user experience: run the documented install path on a clean machine, then assert what it promised"
# On demand like `mise run e2e`, and for the same reason: it is heavy, and it
# proves something no unit test can. What it proves is the *documentation* —
# `Dockerfile.fue` runs the README's install path verbatim on a machine that has
# only git and mise on it, so deleting a documented step is what makes this fail.
#
# Two halves, and the split is the test. The build installs, with network. The
# run asserts, with `--network none`: the offline-first promise is not a claim
# about a good day on a fast connection.
#
# The context is the working tree — this is a proof of the install path in front
# of you, not of one on a server — filtered by `Dockerfile.fue.dockerignore`,
# which is stricter than the review runner's: nothing `ub init` or a local run is
# supposed to create may reach the image.
#
# No `fnox exec`: a new user has no age key, and the whole point is that
# `--if-missing warn` carries them through to a generated development secret.
# Standing rule, as everywhere: no secrets, no host mounts, no privileged mode,
# no Docker socket.
run = """
set -eu

root="$(git rev-parse --show-toplevel)"
tag="uberblick-fue:latest"

if ! docker build --file "$root/Dockerfile.fue" --tag "$tag" "$root"; then
  printf 'fue: FAILED at the documented install path — `mise trust && mise run setup -- --yes` did not complete on a clean machine; the failing step is the last command above.\\n' >&2
  exit 1
fi

docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges "$tag"
printf 'fue image retained for probes: %s\\n' "$tag"
"""

[tasks.review]
description = "Build and verify an immutable commit in Docker (SHA argument defaults to HEAD)"
usage = 'arg "[sha]" help="Commit to review" default="HEAD"'
# Trust boundary (README, "Review isolation"): the reviewed commit supplies file
# contents, and main supplies the build recipe — this task, `Dockerfile.review`,
# `.dockerignore`, and how the context is assembled at all. The task
# therefore refuses unless the checkout it runs in is a freshly fetched
# `origin/main` with those runner paths unmodified, and it then reads the runner
# files out of that commit object rather than off the mutable checkout.
# `git archive` needs the reviewed commit fetched, not checked out. The build
# stage keeps network because installing the pinned pnpm and the lockfile needs
# the registry — so the reviewed lockfile's own install scripts do run there;
# only the verification container is isolated.
#
# To re-prove that nothing but main steers a review: clone this repo into a temp
# dir whose `origin/main` is this runner, give that clone a hostile
# `core.attributesFile` and `.git/info/attributes`, an untracked
# `Dockerfile.review.dockerignore` and a `git replace` aiming the fixture commit
# at a benign one, and review a throwaway local commit
# (`git commit-tree`, never pushed) carrying a hostile `Dockerfile.review`, a
# `.gitattributes` with `export-ignore`/`export-subst`, a `.dockerignore`
# symlinked at a host path, and a failing test. The hostile instruction must not
# appear in the build log, the host path must be untouched, and the failing test
# must still run.
run = """
set -eu

# Before any object is resolved: a `refs/replace/*` entry in this repo would
# swap the object graph under every command below, so that `<sha>` names one
# commit and reads another — reviewing X while testing Y.
GIT_NO_REPLACE_OBJECTS=1
export GIT_NO_REPLACE_OBJECTS

root="$(git rev-parse --show-toplevel)"
review_sha="$(git -C "$root" rev-parse --verify --end-of-options "${usage_sha?}^{commit}")"

# One temp tree and one private ref, both released by a trap installed before
# either exists. The fetch lands on that private ref rather than FETCH_HEAD,
# which any concurrent fetch in the same repo would overwrite under us.
review_ref="refs/review-runner/$$"
parent=""
cleanup() {
  if [ -n "$parent" ]; then rm -rf "$parent"; fi
  git -C "$root" update-ref -d "$review_ref" 2>/dev/null || true
}
trap cleanup EXIT
trap 'exit 130' HUP INT TERM

git -C "$root" fetch --quiet --force origin "main:$review_ref"
main_sha="$(git -C "$root" rev-parse --verify "$review_ref")"
if [ "$(git -C "$root" rev-parse HEAD)" != "$main_sha" ]; then
  printf 'review: refusing — run from a checkout at origin/main (%s); this one is at %s.\\n' "$main_sha" "$(git -C "$root" rev-parse HEAD)" >&2
  exit 1
fi
if ! git -C "$root" diff --quiet "$main_sha" -- mise.toml Dockerfile.review .dockerignore; then
  printf 'review: refusing — the runner files (mise.toml, Dockerfile.review, .dockerignore) differ from origin/main.\\n' >&2
  exit 1
fi

parent="$(mktemp -d)"
runner="$parent/runner"
context="$parent/context"
tarball="$parent/source.tar"
mkdir "$runner" "$context"

# Build from the bytes the guard just checked, not from files the checkout could
# change afterwards. The Dockerfile lives in a directory only this task writes,
# which also puts BuildKit's `<dockerfile>.dockerignore` sidecar lookup — which
# outranks the context's ignore file, and would accept an untracked sidecar that
# no `git diff` can see — inside that same private directory.
git -C "$root" show "$main_sha:Dockerfile.review" > "$runner/Dockerfile.review"

# `export-ignore` silently drops a file from an archive and `export-subst`
# rewrites one, so the context must be built where no attribute of any origin
# applies. Attributes reach `git archive` from four places, and neither
# `--attr-source` nor `attr.tree` overrides any of them for archive: the tree
# being archived, `$GIT_DIR/info/attributes`, `core.attributesFile`, and the
# system file. So work in a scratch git dir that borrows this repo's objects and
# owns nothing else (source two), with the config path emptied and the system
# file off (three and four), and archive a copy of the tree with every
# `.gitattributes` removed (source one). The stripped tree is synthesized there
# too, so the reviewed commit costs the invoking repository no new objects.
archive_dir="$parent/archive.git"
git init --quiet --bare --template= "$archive_dir"
rm -f "$archive_dir/info/attributes"
printf '%s/objects\\n' "$(git -C "$root" rev-parse --path-format=absolute --git-common-dir)" > "$archive_dir/objects/info/alternates"

# --work-tree is a formality `ls-files` insists on; every command here reads or
# writes the scratch index and object store only, never the filesystem.
scratch() {
  GIT_ATTR_NOSYSTEM=1 git --git-dir="$archive_dir" --work-tree="$parent" -c core.attributesFile=/dev/null "$@"
}
scratch read-tree "$review_sha"
scratch ls-files -z -- '.gitattributes' '*/.gitattributes' | scratch update-index --force-remove -z --stdin
source_tree="$(scratch write-tree)"
scratch archive --format=tar --output "$tarball" "$source_tree"
tar -xf "$tarball" -C "$context"

# The ignore file is build recipe too: a branch-owned one could exclude its own
# failing tests. Remove the archived entry first — `rm` does not follow symlinks,
# so a `.dockerignore` symlinked at a host path is unlinked, never written
# through — and only then write main's.
rm -rf "$context/.dockerignore"
git -C "$root" show "$main_sha:.dockerignore" > "$context/.dockerignore"

review_tag="uberblick-review:${review_sha}"
docker build --file "$runner/Dockerfile.review" --tag "$review_tag" "$context"
docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges "$review_tag"
printf 'Review image retained for probes: %s\\n' "$review_tag"
"""
