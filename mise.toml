[tools]
node = "26"
pnpm = "10"
fnox = "1"

# Plaintext local defaults. Only real secrets belong in fnox.toml.
#
# HUB_URL is the websocket endpoint clients (web, mcp-server) dial. The hub
# itself binds HUB_HOST:PORT — default 127.0.0.1:1234 in code — so the two must
# agree; override them together when running the hub somewhere else. The bind
# address is loopback until someone opts into more: the hub's only credential is
# a shared dev secret, so `HUB_HOST=0.0.0.0` is a deliberate choice.
[env]
HUB_URL = "ws://localhost:1234"

[tasks.hub]
description = "Start the Hocuspocus sync hub (binds HUB_HOST:PORT, default 127.0.0.1:1234)"
run = "fnox exec --if-missing warn -- pnpm --filter @uberblick/hub start"

[tasks.mcp]
description = "Start the MCP server for a smoke test — an MCP client normally spawns it over stdio itself"
# --silent keeps pnpm's own lifecycle banner off stdout: stdout is the JSON-RPC
# transport, so anything but MCP frames there breaks the session.
run = "fnox exec --if-missing warn -- pnpm --silent --filter @uberblick/mcp-server start"

[tasks.web]
description = "Start the Vite dev server"
run = "fnox exec --if-missing warn -- pnpm --filter @uberblick/web dev"

[tasks.build-web]
description = "Build the web client with HUB_URL and HUB_AUTH_TOKEN baked into packages/web/dist"
run = "fnox exec --if-missing error -- pnpm --filter @uberblick/web build"

# hub + web only. The MCP server is a stdio process spawned by its client
# (Claude Code et al.), so it is not part of the dev loop; use `mise run mcp`
# for a standalone smoke test.
#
# These are long-running, so `depends` is wrong here: with MISE_JOBS=1 mise
# would run the hub to completion before ever starting web. Fan out explicitly
# instead, and take the whole process group down on Ctrl-C.
[tasks.dev]
description = "Run the hub and the web dev server together"
run = """
mise run hub &
mise run web &
trap 'kill 0' INT TERM
wait
"""

[tasks.import-seed]
description = "One-time import of docs-seed/*.md into the system (idempotent by frontmatter uuid)"
# Writes through the MCP server's own replicas and update log, so it works with
# no hub: the docs land locally and sync when one is reachable.
run = "fnox exec --if-missing warn -- pnpm --filter @uberblick/mcp-server run import-seed"

[tasks.agent-cursor]
description = "Park a demo agent cursor in a document's first block (optional `-- <docUuid>`)"
run = "fnox exec --if-missing warn -- pnpm --filter @uberblick/web run agent-cursor"

[tasks.install]
description = "Install workspace dependencies (frozen lockfile in CI)"
# PNPM_STORE_DIR is a convention of this task, not something pnpm reads: CI sets
# it to the store it caches, and pnpm expands the `~` itself. Unset locally, so
# pnpm keeps using its own default store.
run = 'pnpm install --frozen-lockfile ${PNPM_STORE_DIR:+--store-dir "$PNPM_STORE_DIR"}'

[tasks.lint]
description = "Lint the workspace with Biome (lint only — the formatter stays off)"
# Biome is one root-level binary, not a per-package script, so this is `pnpm
# lint` rather than `pnpm -r lint`. The root script carries the flags so the
# Docker review runs the identical command.
run = "pnpm lint"

[tasks.typecheck]
description = "Typecheck every package (tsc --noEmit)"
run = "pnpm -r typecheck"

[tasks.test]
description = "Run all test suites"
run = "pnpm -r test"

[tasks.e2e]
description = "Run the browser end-to-end proof points (Playwright, Chromium only)"
# No `fnox exec`: the harness starts its own hub on an ephemeral port with its
# own throwaway signing secret and a temp database, so nothing here needs the
# real one — and nothing collides with a `mise run dev` on 1234/5173.
#
# `playwright install` runs first because the browser is a download, not a
# dependency pnpm can fetch: it is a no-op once the pinned Chromium is in the
# local cache, and the alternative is a first run that fails with instructions.
run = """
pnpm --filter @uberblick/web exec playwright install chromium
pnpm --filter @uberblick/web run e2e
"""

[tasks.review]
description = "Build and verify an immutable commit in Docker (REVIEW_SHA defaults to HEAD)"
# Trust boundary (README, "Review isolation"): the reviewed commit supplies file
# contents, and main supplies the build recipe — this task, `Dockerfile.review`,
# `.dockerignore`, and how the context is assembled at all. The task
# therefore refuses unless the checkout it runs in is a freshly fetched
# `origin/main` with those runner paths unmodified, and it then reads the runner
# files out of that commit object rather than off the mutable checkout.
# `git archive` needs the reviewed commit fetched, not checked out. The build
# stage keeps network because installing the pinned pnpm and the lockfile needs
# the registry — so the reviewed lockfile's own install scripts do run there;
# only the verification container is isolated.
#
# To re-prove that nothing but main steers a review: clone this repo into a temp
# dir whose `origin/main` is this runner, give that clone a hostile
# `core.attributesFile` and `.git/info/attributes`, an untracked
# `Dockerfile.review.dockerignore` and a `git replace` aiming the fixture commit
# at a benign one, and review a throwaway local commit
# (`git commit-tree`, never pushed) carrying a hostile `Dockerfile.review`, a
# `.gitattributes` with `export-ignore`/`export-subst`, a `.dockerignore`
# symlinked at a host path, and a failing test. The hostile instruction must not
# appear in the build log, the host path must be untouched, and the failing test
# must still run.
run = """
set -eu

# Before any object is resolved: a `refs/replace/*` entry in this repo would
# swap the object graph under every command below, so that `<sha>` names one
# commit and reads another — reviewing X while testing Y.
GIT_NO_REPLACE_OBJECTS=1
export GIT_NO_REPLACE_OBJECTS

root="$(git rev-parse --show-toplevel)"
review_sha="$(git -C "$root" rev-parse --verify --end-of-options "${REVIEW_SHA:-HEAD}^{commit}")"

# One temp tree and one private ref, both released by a trap installed before
# either exists. The fetch lands on that private ref rather than FETCH_HEAD,
# which any concurrent fetch in the same repo would overwrite under us.
review_ref="refs/review-runner/$$"
parent=""
cleanup() {
  if [ -n "$parent" ]; then rm -rf "$parent"; fi
  git -C "$root" update-ref -d "$review_ref" 2>/dev/null || true
}
trap cleanup EXIT
trap 'exit 130' HUP INT TERM

git -C "$root" fetch --quiet --force origin "main:$review_ref"
main_sha="$(git -C "$root" rev-parse --verify "$review_ref")"
if [ "$(git -C "$root" rev-parse HEAD)" != "$main_sha" ]; then
  printf 'review: refusing — run from a checkout at origin/main (%s); this one is at %s.\\n' "$main_sha" "$(git -C "$root" rev-parse HEAD)" >&2
  exit 1
fi
if ! git -C "$root" diff --quiet "$main_sha" -- mise.toml Dockerfile.review .dockerignore; then
  printf 'review: refusing — the runner files (mise.toml, Dockerfile.review, .dockerignore) differ from origin/main.\\n' >&2
  exit 1
fi

parent="$(mktemp -d)"
runner="$parent/runner"
context="$parent/context"
tarball="$parent/source.tar"
mkdir "$runner" "$context"

# Build from the bytes the guard just checked, not from files the checkout could
# change afterwards. The Dockerfile lives in a directory only this task writes,
# which also puts BuildKit's `<dockerfile>.dockerignore` sidecar lookup — which
# outranks the context's ignore file, and would accept an untracked sidecar that
# no `git diff` can see — inside that same private directory.
git -C "$root" show "$main_sha:Dockerfile.review" > "$runner/Dockerfile.review"

# `export-ignore` silently drops a file from an archive and `export-subst`
# rewrites one, so the context must be built where no attribute of any origin
# applies. Attributes reach `git archive` from four places, and neither
# `--attr-source` nor `attr.tree` overrides any of them for archive: the tree
# being archived, `$GIT_DIR/info/attributes`, `core.attributesFile`, and the
# system file. So work in a scratch git dir that borrows this repo's objects and
# owns nothing else (source two), with the config path emptied and the system
# file off (three and four), and archive a copy of the tree with every
# `.gitattributes` removed (source one). The stripped tree is synthesized there
# too, so the reviewed commit costs the invoking repository no new objects.
archive_dir="$parent/archive.git"
git init --quiet --bare --template= "$archive_dir"
rm -f "$archive_dir/info/attributes"
printf '%s/objects\\n' "$(git -C "$root" rev-parse --path-format=absolute --git-common-dir)" > "$archive_dir/objects/info/alternates"

# --work-tree is a formality `ls-files` insists on; every command here reads or
# writes the scratch index and object store only, never the filesystem.
scratch() {
  GIT_ATTR_NOSYSTEM=1 git --git-dir="$archive_dir" --work-tree="$parent" -c core.attributesFile=/dev/null "$@"
}
scratch read-tree "$review_sha"
scratch ls-files -z -- '.gitattributes' '*/.gitattributes' | scratch update-index --force-remove -z --stdin
source_tree="$(scratch write-tree)"
scratch archive --format=tar --output "$tarball" "$source_tree"
tar -xf "$tarball" -C "$context"

# The ignore file is build recipe too: a branch-owned one could exclude its own
# failing tests. Remove the archived entry first — `rm` does not follow symlinks,
# so a `.dockerignore` symlinked at a host path is unlinked, never written
# through — and only then write main's.
rm -rf "$context/.dockerignore"
git -C "$root" show "$main_sha:.dockerignore" > "$context/.dockerignore"

review_tag="uberblick-review:${review_sha}"
docker build --file "$runner/Dockerfile.review" --tag "$review_tag" "$context"
docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges "$review_tag"
printf 'Review image retained for probes: %s\\n' "$review_tag"
"""
