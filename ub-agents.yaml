# Uberblick's delivery workflow. Roles and outcomes live in .agents/roles/; the
# label changes below mirror the outcome table in .agents/protocols/workflow.md.
repository: uberblick-ai/uberblick-2

queue:
  priority:
    labels: [priority:urgent, priority:high, priority:medium, priority:low]
    default: priority:medium
  milestones: ignore
  dependencies: wait

stop-labels: [needs-human]

cleanup:
  command: [python3, scripts/cleanup-agent-worktree.py]
  timeout-seconds: 60

agents:
  issue-preparer:
    runtime: "claude:claude-opus-5-5:xhigh"
    kind: issue
    trigger: needs-preparation
    instructions: .agents/roles/issue-preparer.md
    outcomes:
      ready: {add: [ready]}
      review: {add: [needs-review]}
      split: {}
      wontfix: {}
      needs-human: {add: [needs-human]}
    agent-timeout-minutes: 60
    runtime-args: &claude-scoped
      - --permission-mode
      - acceptEdits
      - --permission-prompts
      - none
      # The run's private scratch directory, writable without a prompt.
      - --add-dir
      - "{scratch}"
      - --allowedTools
      - "Bash(git *)"
      - "Bash(gh *)"
      # Reports go through the launcher's own installation, not whatever `ub-agents` PATH finds.
      - "Bash({report_command} report *)"
      - "Bash(ub-agents *)"
      - "Bash(mise *)"
      - "mcp__uberblick__*"
      - "Bash(sh bin/housekeeping.sh *)"
      - "Bash(docker *)"
      # Read-only and scratch helpers, so compound commands such as `cd /tmp/ub-x && mise run review SHA`
      # or `… | tail` are not denied part by part in headless runs.
      - "Bash(cd *)"
      - "Bash(mkdir *)"
      - "Bash(mktemp *)"
      - "Bash(rm -rf /tmp/ub-*)"
      - "Bash(head *)"
      - "Bash(tail *)"
      - "Bash(echo *)"
      - "Bash(cat *)"
      - "Bash(grep *)"
      - "Bash(sed *)"
      - "Bash(ls *)"
      - "Bash(wc *)"
      - "Bash(sort *)"
      - "Bash(find *)"
      - "Bash(jq *)"
      - "Bash(node *)"

  issue-reviewer:
    runtime: "codex:gpt-6.1-sol:xhigh"
    kind: issue
    trigger: needs-review
    instructions: .agents/roles/reviewer.md
    outcomes:
      approve: {add: [ready]}
      changes: {add: [needs-preparation]}
      needs-human: {add: [needs-human]}
    agent-timeout-minutes: 60
    runtime-args: &codex-scoped
      - --sandbox
      - danger-full-access
      - -c
      - 'mcp_servers.uberblick.command="mise"'
      - -c
      - 'mcp_servers.uberblick.args=["exec", "--", "ub", "mcp", "serve"]'
      - -c
      - 'mcp_servers.uberblick.default_tools_approval_mode="approve"'

  implementer:
    runtime: "codex:gpt-6.1-sol:ultra"
    trigger: [needs-changes, ready]
    instructions: .agents/roles/implementer.md
    worktree: true
    outcomes:
      review: {add: [needs-review]}
      integrate: {add: [ready-to-merge]}
      returned: {add: [needs-preparation]}
      needs-human: {add: [needs-human]}
    agent-timeout-minutes: 180
    runtime-args: *codex-scoped

  pr-reviewer:
    runtime: "claude:claude-opus-5-5:xhigh"
    kind: pr
    trigger: needs-review
    different-runtime-from: implementer
    instructions: .agents/roles/reviewer.md
    worktree: true
    outcomes:
      approve: {add: [ready-to-merge]}
      changes: {add: [needs-changes]}
      needs-human: {add: [needs-human]}
    agent-timeout-minutes: 120
    runtime-args: *claude-scoped

  integrator:
    runtime: "claude:claude-opus-5-5:xhigh"
    kind: pr
    trigger: ready-to-merge
    instructions: .agents/roles/integrator.md
    outcomes:
      merged: {}
      changes: {add: [needs-changes]}
      review: {add: [needs-review]}
      needs-human: {add: [needs-human]}
    agent-timeout-minutes: 120
    runtime-args: *claude-scoped

limits:
  max-attempts: 5
  retry-backoff-seconds: 60
  max-backoff-seconds: 3600

# Every poll reads each triggered item; keep idle polling slow to stay inside GitHub's
# 5,000 requests per hour shared by all launchers (ub-agents #79, #80).
poll-seconds: 300
