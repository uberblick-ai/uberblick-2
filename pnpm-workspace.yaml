packages:
  - "packages/*"

# Patch the pinned server without changing its resolution. The counter removes
# a quadratic scan from full-corpus attachment. Auth-first admission and the
# close-then-refuse reply are pinned beside the dependency's other seams.
patchedDependencies:
  "@hocuspocus/server@4.7.1": patches/@hocuspocus__server@4.7.1.patch

# Postinstall builds we explicitly trust (pnpm 10 blocks these by default).
# Nothing here compiles a native addon any more: SQLite comes from `node:sqlite`
# in both the hub and the MCP server.
onlyBuiltDependencies:
  - esbuild

# CRDT single-instance contract.
#
# yjs, y-protocols and y-prosemirror keep module-level state and use instanceof
# checks across the doc boundary: two copies of yjs in one process silently
# corrupt documents. Workspace packages reference these through `catalog:` so
# they all ask for the same exact version...
catalog:
  yjs: 13.6.32
  y-protocols: 1.0.7
  y-prosemirror: 1.3.7

# ...and overrides pin transitive requests (y-prosemirror's yjs peer and
# @hocuspocus/*'s y-protocols) to that same version, so
# the store holds exactly one copy. Verify with `mise exec -- pnpm why yjs`.
overrides:
  yjs: 13.6.32
  y-protocols: 1.0.7
  y-prosemirror: 1.3.7

  # SDK schema conversion defines the tools/list golden; bumps must be deliberate.
  "@modelcontextprotocol/sdk": 1.32.1

  # Not a CRDT instance concern: `@hocuspocus/common` is the one Hocuspocus
  # package of the three no manifest here names, and `@hocuspocus/server` and
  # `@hocuspocus/provider` both ask for it as `^4.7.1` — a range the workspace
  # cannot pin anywhere else. Keep all three at exactly 4.7.1: the hub's auth
  # boundary reads library internals, so a patch bump has to be a reviewed act
  # rather than a resolution.
  # `packages/hub/test/hocuspocus-pins.test.ts` fails if any of the three
  # regains a range; the seams the pin protects are characterized next to it.
  "@hocuspocus/common": 4.7.1
