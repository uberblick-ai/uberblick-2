name: uberblick-remote

services:
  hub:
    build:
      context: .
      target: hub
    environment:
      HUB_AUTH_TOKEN: "${HUB_AUTH_TOKEN:?set HUB_AUTH_TOKEN in .env}"
      # Unset/empty uses public Uberblick Login: no app registration is needed.
      # Optionally set your own Device Flow app to control its settings/budget;
      # init re-runs and updates preserve it. Remove and recreate to use the
      # default again. See REMOTE.md for app settings and shared limits. GitHub
      # names the app, not the hub; setup codes go only to the intended admin.
      # This reaches only the hub, never browser configuration or the web build.
      HUB_GITHUB_CLIENT_ID: "${HUB_GITHUB_CLIENT_ID:-}"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - hub-data:/data

  caddy:
    build:
      context: .
      target: web
    depends_on:
      - hub
    environment:
      TAILSCALE_HOST: "${TAILSCALE_HOST:?set TAILSCALE_HOST in .env}"
      # Native operator names are validated by the image entrypoint before
      # becoming Caddy's HUB_URL and WORKSPACES. One bundle serves every host.
      WEB_HUB_URL: "${WEB_HUB_URL:-}"
      WEB_WORKSPACES: "${WEB_WORKSPACES:-}"
      HUB_AUTH_TOKEN: "${HUB_AUTH_TOKEN:?set HUB_AUTH_TOKEN in .env}"
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:443:443"
    restart: unless-stopped
    user: "0:0"
    volumes:
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      - caddy-data:/data
      - caddy-config:/config

volumes:
  hub-data:
  caddy-data:
  caddy-config:
