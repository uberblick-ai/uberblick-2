name: uberblick-remote

services:
  hub:
    build:
      context: .
      target: hub
    environment:
      HUB_AUTH_TOKEN: "${HUB_AUTH_TOKEN:?set HUB_AUTH_TOKEN in .env}"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - hub-data:/data

  caddy:
    build:
      context: .
      target: web
      args:
        HUB_URL: "wss://${TAILSCALE_HOST:?set TAILSCALE_HOST in .env}/ws"
        HUB_AUTH_TOKEN_DIGEST: "${HUB_AUTH_TOKEN_DIGEST:?run commands through sh remote-compose.sh}"
      secrets:
        - hub-auth-token
    depends_on:
      - hub
    environment:
      TAILSCALE_HOST: "${TAILSCALE_HOST:?set TAILSCALE_HOST in .env}"
      # What Caddy serves at /uberblick-config.json, and therefore the hub the
      # browser actually dials — the build argument above is only the fallback
      # compiled into the bundle. Deliberately not named HUB_URL on the host
      # side: that name already means "the hub my local tools dial" (mise
      # `[env]`, MCP clients), and inheriting a developer's `ws://localhost:1234`
      # here would silently serve it to every visitor.
      HUB_URL: "${WEB_HUB_URL:-wss://${TAILSCALE_HOST:?set TAILSCALE_HOST in .env}/ws}"
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:443:443"
    restart: unless-stopped
    user: "0:0"
    volumes:
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      - caddy-data:/data
      - caddy-config:/config

volumes:
  hub-data:
  caddy-data:
  caddy-config:

secrets:
  hub-auth-token:
    environment: HUB_AUTH_TOKEN
