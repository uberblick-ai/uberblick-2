    <title>uberblick</title>
    <!-- The bundled Geist faces are SIL Open Font License 1.1, which requires
         the license to travel with the font software wherever it is
         distributed. Vite only emits assets something references, so this link
         is what pulls LICENSE.txt into `dist/`. `rel="license"` is metadata —
         browsers never fetch it, so it costs nothing at load. -->
    <link rel="license" href="/src/assets/fonts/LICENSE.txt" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
