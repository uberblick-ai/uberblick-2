name: uberblick-remote

services:
  hub:
    image: __HUB_IMAGE__
    platform: linux/amd64
    environment:
      # Unset/empty uses public Uberblick Login: no app registration is needed.
      # Optionally use your own Device Flow app to control its settings/budget.
      # Remove and recreate to use the default again. GitHub names the app, not
      # the hub; give setup codes only to the intended admin. This reaches only
      # the hub, never browser configuration or the web build. See REMOTE.md.
      HUB_GITHUB_CLIENT_ID: "${HUB_GITHUB_CLIENT_ID:-}"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - hub-data:/data

  caddy:
    image: __WEB_IMAGE__
    platform: linux/amd64
    depends_on:
      - hub
    environment:
      WEB_HOST: "${WEB_HOST:-}"
      TAILSCALE_HOST: "${TAILSCALE_HOST:-}"
      TAILSCALE_IP: "${TAILSCALE_IP:-}"
      HTTPS_BIND_IP: "${HTTPS_BIND_IP:-}"
      LOOPBACK_PORT: "${LOOPBACK_PORT:-8080}"
      WEB_HUB_URL: "${WEB_HUB_URL:-}"
      WEB_WORKSPACES: "${WEB_WORKSPACES:-}"
      # Entrypoints validate all document inputs, including with plain Compose.
    ports:
      - "127.0.0.1:${LOOPBACK_PORT:-8080}:80"
    restart: unless-stopped
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  hub-data:
  caddy-data:
  caddy-config:
