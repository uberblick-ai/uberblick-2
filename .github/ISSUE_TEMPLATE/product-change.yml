name: Product improvement or bug
description: Describe a goal, problem, or bug; preparation will turn it into an implementation-ready issue
labels:
  - needs-preparation
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Rough notes are fine. Only the goal is required; preparation turns this into the final issue. Do not include secrets or private document content.
  - type: textarea
    id: goal-or-problem
    attributes:
      label: Goal or problem
      description: What happens now, who is affected if relevant, and what outcome would be better?
      placeholder: Describe the problem or desired outcome in your own words.
    validations:
      required: true
  - type: textarea
    id: evidence-or-example
    attributes:
      label: Evidence or example
      description: Add anything useful, such as an example, log, or observation. For a bug, actual behavior, expected behavior, and reproduction steps are helpful.
    validations:
      required: false
  - type: textarea
    id: design-references
    attributes:
      label: Design references
      description: For a change people see, attach a screenshot, sketch, wireframe or mockup, or name the corpus page that holds the design. When the picture and your text disagree, the picture wins unless you say otherwise.
    validations:
      required: false
  - type: textarea
    id: known-constraints
    attributes:
      label: Known constraints
      description: Note anything that must not change, or leave this blank when none are known.
      placeholder: None known.
    validations:
      required: false
