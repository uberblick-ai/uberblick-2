name: Bug report
description: Report a problem with Uberblick
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use [private vulnerability reporting](https://github.com/uberblick-ai/uberblick-2/security/advisories/new).
        Do not include credentials or private document content.
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Web app
        - Command line (ub)
        - MCP, through an agent
        - Hub server
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Uberblick version
      description: Paste the output of `ub --version`, or leave blank if you only use Uberblick in the browser.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version for the web app; operating system, version and CPU architecture for the command line.
      placeholder: Firefox 144 on macOS; or Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: For a problem you can see, a screenshot or short recording helps most.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the commands, pages or clicks needed to see the problem.
    validations:
      required: true
