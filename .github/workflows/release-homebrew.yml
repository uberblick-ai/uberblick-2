name: Publish Homebrew release

# Release step: push an exact vMAJOR.MINOR.PATCH tag. The tag-only environment
# policy is the authority that admits this job to HOMEBREW_TAP_TOKEN, which is
# the only credential the publisher needs: the asset and the formula both land
# on the public tap. The script verifies the tag again before it publishes.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: homebrew-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish payload and tap formula
    runs-on: ubuntu-latest
    environment: homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      - name: Publish the immutable release and generated formula
        run: mise run publish-homebrew-release -- "$GITHUB_REF_NAME"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
