name: Publish Homebrew release

# Release step: push an exact vMAJOR.MINOR.PATCH tag for the product, or an
# exact workflow-vMAJOR.MINOR.PATCH tag for the agent-workflow package. The
# tag-only environment policy is the authority that admits this job to
# HOMEBREW_TAP_TOKEN, which is the only credential either publisher needs: both
# assets land on the public tap. Each script verifies the tag again before it
# publishes.
#
# One job for both tag namespaces, dispatching on the ref, on purpose: the
# environment and its single token are declared exactly once here, so adding the
# workflow package widens no credential boundary. Admitting a workflow-v tag to
# the token is a change to that environment's deployment tag policy, which lives
# in repository settings and is #967's, not this workflow's.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "workflow-v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: homebrew-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish payload and tap formula
    runs-on: ubuntu-latest
    environment: homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      # Assembling the workflow payload happens here, in a step with no token in
      # its environment, so credential absence is structural rather than
      # asserted. The publish step below only reads what this one left in dist/.
      - name: Build the workflow package
        if: startsWith(github.ref_name, 'workflow-v')
        run: mise run build-workflow-package -- "${GITHUB_REF_NAME#workflow-v}"

      - name: Publish the immutable release for this tag
        run: |
          case "$GITHUB_REF_NAME" in
            workflow-v*) mise run publish-workflow-package -- "$GITHUB_REF_NAME" ;;
            *) mise run publish-homebrew-release -- "$GITHUB_REF_NAME" ;;
          esac
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
