name: Publish Homebrew release

# Release step: push an exact vMAJOR.MINOR.PATCH tag. The tag-only environment
# policy is the authority that admits this job to HOMEBREW_TAP_TOKEN, the
# credential for publishing the asset and formula on the public tap. Provenance
# uses this repository's workflow token and OIDC. The script verifies the tag.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: homebrew-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish payload and tap formula
    runs-on: ubuntu-latest
    environment: homebrew-tap
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      - name: Publish the immutable release and generated formula
        id: publish
        run: mise run publish-homebrew-release -- "$GITHUB_REF_NAME"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest the payload built by this run
        if: steps.publish.outputs.outcome == 'published' && steps.publish.outputs.archive != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.publish.outputs.archive }}
      - name: Verify the published payload has release provenance
        if: steps.publish.outputs.outcome == 'published' && steps.publish.outputs.archive != ''
        run: >-
          node scripts/release-attestation.mjs release-homebrew.yml "$GITHUB_REF_NAME" "$GITHUB_SHA"
          "${{ steps.publish.outputs.archive }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
