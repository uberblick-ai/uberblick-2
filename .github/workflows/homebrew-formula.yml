name: Homebrew formula

# The one proof local CI cannot run on a developer's machine without touching its
# own Homebrew installation. Linux only, after merge, and only when what ships
# through Homebrew changed; macOS minutes cost ten times as much.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/homebrew-formula.yml
      - package.json
      - pnpm-lock.yaml
      - packages/cli/bin/**
      - scripts/build-install-payload.mjs
      - scripts/homebrew-*.mjs
      - scripts/lib/homebrew-proof.mjs
      - scripts/publish-homebrew-release.mjs
  workflow_dispatch:

concurrency:
  group: homebrew-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# brew tap-new commits its scaffold; do not rely on a runner's Git identity.
env:
  HOMEBREW_GIT_NAME: Homebrew proof
  HOMEBREW_GIT_EMAIL: homebrew-proof@example.invalid

jobs:
  upgrade:
    name: Linux x86_64 upgrade
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      # The proof builds the two payloads it upgrades between, so it needs the
      # workspace's dependencies.
      - run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      # Two versions built here stand in for two published releases; the public
      # transcript belongs to the tap's second publication (#842).
      - name: Upgrade an installed release through Homebrew
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          node scripts/homebrew-upgrade-proof.mjs 0.1.0 0.1.1
