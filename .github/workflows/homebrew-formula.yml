name: Homebrew formula

on:
  # Every PR and main push: the payload includes workspace source, templates,
  # dependencies and toolchain inputs, including future ones.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# brew tap-new commits its scaffold; do not rely on a runner's Git identity.
env:
  GIT_AUTHOR_NAME: Homebrew proof
  GIT_AUTHOR_EMAIL: homebrew-proof@example.invalid
  GIT_COMMITTER_NAME: Homebrew proof
  GIT_COMMITTER_EMAIL: homebrew-proof@example.invalid

jobs:
  formula:
    name: ${{ matrix.platform }} install
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Apple Silicon
            runner: macos-15
            os: Darwin
            arch: arm64
          - platform: Linux x86_64
            runner: ubuntu-24.04
            os: Linux
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install and prove the formula from a throwaway tap
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          test "$(uname -s)" = "${{ matrix.os }}"
          test "$(uname -m)" = "${{ matrix.arch }}"
          if [ "${{ runner.os }}" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi

          export XDG_CONFIG_HOME="$RUNNER_TEMP/uberblick-formula-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/uberblick-formula-data"

          tap=uberblick-ai/formula-proof
          brew tap-new "$tap"
          cp Formula/uberblick.rb "$(brew --repository "$tap")/Formula/uberblick.rb"
          mkdir "$RUNNER_TEMP/uberblick-formula-cwd"
          cd "$RUNNER_TEMP/uberblick-formula-cwd"

          brew install --build-from-source "$tap/uberblick"
          brew test "$tap/uberblick"
          brew audit --strict "$tap/uberblick"
          node "$GITHUB_WORKSPACE/scripts/homebrew-formula-proof.mjs" \
            "$tap/uberblick" 0.1.0 "$GITHUB_WORKSPACE/Formula/uberblick.rb"

  upgrade:
    name: ${{ matrix.platform }} upgrade
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Apple Silicon
            runner: macos-15
            os: Darwin
            arch: arm64
          - platform: Linux x86_64
            runner: ubuntu-24.04
            os: Linux
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      # The proof builds the two payloads it upgrades between, so unlike the
      # job above it needs the workspace's dependencies.
      - run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      # Two versions built here stand in for two published releases; the public
      # transcript belongs to the tap's second publication (#842).
      - name: Upgrade an installed release through Homebrew
        run: |
          set -euo pipefail
          test "$(uname -s)" = "${{ matrix.os }}"
          test "$(uname -m)" = "${{ matrix.arch }}"
          if [ "${{ runner.os }}" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          node scripts/homebrew-upgrade-proof.mjs 0.1.0 0.1.1
