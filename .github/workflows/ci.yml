name: CI

# It gates nothing; merges still require the local `signoff` from `mise run ci`
# (CONTRIBUTING.md, "Local CI"). On main it records whether main itself is clean,
# so a failure seen while validating a branch can be checked against main's
# latest run instead of rerunning the base. On a pull request it is an early
# signal the integrator reads before local CI; it runs the PR's own recipe, so
# it never stands in for the signoff. Standard runners cost no Actions minutes
# in a public repository, macOS ones included.
#
# Linux runs everything. macOS runs the tests and browser e2e again, because
# contributors and the loop work on Macs and some failures show up on only one
# of the two; lint and typecheck do not depend on the platform.
#
# No secrets: `install`, `lint`, `typecheck`, `test` and `e2e` need none.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On main, let a started run finish and keep only the newest push waiting behind
# it, so a busy merge day still produces results. On a pull request only the
# newest head matters, so a new push cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not cancel the other's run.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: lint, typecheck and tests
          - os: macos-latest
            name: macOS tests
    steps:
      # On a pull request, test the head itself rather than GitHub's merge with
      # a main that may since have moved; the integrator's merged-tree gate
      # covers the combination.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Installs the toolchain pinned in mise.toml and puts `mise` on PATH.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      # Keyed per platform: the store holds platform-specific optional packages.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - id: install
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      # Each check runs even when an earlier one fails, so one run shows
      # everything that is red on main.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        run: mise run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        run: mise run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mise run test

  # Separate from `checks` so it runs in parallel and only it downloads browsers.
  e2e:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: browser e2e
            browsers: ~/.cache/ms-playwright
          - os: macos-latest
            name: macOS browser e2e
            browsers: ~/Library/Caches/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # Keyed on the lockfile because that is what pins @playwright/test, and
      # the browser build a Playwright version wants is a function of it.
      # Playwright keeps its browsers in a different place on each platform.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ matrix.browsers }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      # Cached engines do not include system packages, so provision WebKit's
      # host libraries on every Linux run; macOS needs none. Local e2e never
      # installs host packages.
      - if: ${{ runner.os == 'Linux' }}
        run: mise exec -- pnpm --filter @uberblick/web exec playwright install-deps webkit

      # The task downloads pinned Chromium and WebKit (a no-op on a cache hit)
      # and starts its own hub and dev server, so there is nothing else to wire.
      - run: mise run e2e
