name: CI

# The merge policy in CLAUDE.md lets the implementation loop self-merge on
# "gates green". This workflow is what makes green verified rather than
# self-reported: it runs the same two mise tasks a human would run locally.
#
# No secrets: `typecheck` and `test` are the only tasks that do not wrap
# `fnox exec`, so they run fine on a runner without the age key.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in mise.toml (node, pnpm, fnox) and
      # caches it; also puts `mise` itself on PATH for the task steps.
      - uses: jdx/mise-action@v4

      - uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store

      - run: mise run typecheck
      - run: mise run test
