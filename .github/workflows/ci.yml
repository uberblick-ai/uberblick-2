name: CI

# The merge gate (CONTRIBUTING.md, "CI"): the main ruleset requires the checks
# `lint, typecheck and tests`, `macOS tests` and `browser e2e` from GitHub
# Actions. On main it records whether main itself is clean, so a failure
# seen while validating a branch can be checked against main's latest run
# instead of rerunning the base. A pull request's run uses its own recipe, so a
# change here is a change to the merge rules. Standard runners cost no Actions
# minutes in a public repository, macOS ones included.
#
# Linux runs everything. Browser coverage uses independent interactive runners
# and a separate workload runner, all behind one required aggregate check.
# WebKit runs on iPad only; Chromium covers the desktop.
# macOS reruns only the suites whose behaviour can differ by OS (`mise run
# test-os`): contributors and the loop work on Macs and run the full suite
# there, and lint, typecheck and pure logic do not depend on the platform.
# Browser e2e stays Linux-only until its specs hold on GitHub's macOS runners.
#
# No secrets: `install`, `lint`, `typecheck`, `test` and `e2e` need none.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On main, let a started run finish and keep only the newest push waiting behind
# it, so a busy merge day still produces results. On a pull request only the
# newest head matters, so a new push cancels the run in progress.
# Manual timing samples each finish without replacing another queued sample.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # On a pull request, test the head itself rather than GitHub's merge with
      # a main that may since have moved; the integrator's merged-tree gate
      # covers the combination.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Installs the toolchain pinned in mise.toml and puts `mise` on PATH.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4

      # Keyed per platform: the store holds platform-specific optional packages.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - id: install
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      # Each check runs even when an earlier one fails, so one run shows
      # everything that is red on main.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mise run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mise run typecheck

  unit-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cli
            name: cli tests
            command: mise exec -- pnpm --filter @uberblick/cli test
          - id: mcp-server
            name: mcp-server tests
            command: mise exec -- pnpm --filter @uberblick/mcp-server test
          - id: web
            name: web tests
            command: mise exec -- pnpm --filter @uberblick/web test
          - id: hub-schema-scripts
            name: hub, schema and scripts tests
            command: mise exec -- node scripts/run-unit-tests.mjs hub-schema
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - id: install
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      - id: test-packages
        run: ${{ matrix.command }}
      # Script contracts still run when a package in this job fails.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.id == 'hub-schema-scripts' }}
        run: mise exec -- pnpm run test:scripts
      - name: Upload per-test results
        if: ${{ always() && (steps.test-packages.outcome == 'success' || steps.test-packages.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-Linux-${{ matrix.id }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vitest-results/
          if-no-files-found: warn

  macos:
    name: macOS tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - id: install
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      - id: test-macos
        run: mise run test-os
      - name: Upload per-test results
        if: ${{ always() && (steps.test-macos.outcome == 'success' || steps.test-macos.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-${{ runner.os }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vitest-results/
          if-no-files-found: warn

  checks:
    name: lint, typecheck and tests
    needs: [lint, unit-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Rulesets accept skipped checks, so only success may pass this gate.
      - run: test '${{ needs.lint.result }}' = success && test '${{ needs.unit-tests.result }}' = success

  # Files stay serial internally; each job gets its own bundle and harnesses.
  e2e-chromium-1:
    name: browser chromium (1/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-

      - name: Install workspace packages
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      - name: Download pinned browser engines
        run: mise exec -- pnpm --filter @uberblick/web exec playwright install chromium webkit

      - name: Run browser suite
        id: browser-suite
        run: mise run e2e --project=chromium --shard=1/3

      - name: Upload browser results
        if: ${{ always() && (steps.browser-suite.outcome == 'success' || steps.browser-suite.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.job }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: packages/web/test-results/
          if-no-files-found: warn

  e2e-chromium-2:
    name: browser chromium (2/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-

      - name: Install workspace packages
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      - name: Download pinned browser engines
        run: mise exec -- pnpm --filter @uberblick/web exec playwright install chromium webkit

      - name: Run browser suite
        id: browser-suite
        run: mise run e2e --project=chromium --shard=2/3

      - name: Upload browser results
        if: ${{ always() && (steps.browser-suite.outcome == 'success' || steps.browser-suite.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.job }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: packages/web/test-results/
          if-no-files-found: warn

  e2e-chromium-3:
    name: browser chromium (3/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-

      - name: Install workspace packages
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      - name: Download pinned browser engines
        run: mise exec -- pnpm --filter @uberblick/web exec playwright install chromium webkit

      - name: Run browser suite
        id: browser-suite
        run: mise run e2e --project=chromium --shard=3/3

      - name: Upload browser results
        if: ${{ always() && (steps.browser-suite.outcome == 'success' || steps.browser-suite.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.job }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: packages/web/test-results/
          if-no-files-found: warn

  e2e-webkit-1:
    name: browser webkit (1/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install workspace packages
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      - name: Download pinned browser engines
        run: mise exec -- pnpm --filter @uberblick/web exec playwright install chromium webkit

      - name: Run browser suite
        id: browser-suite
        run: mise run e2e --project=webkit-ipad --shard=1/3

      - name: Upload browser results
        if: ${{ always() && (steps.browser-suite.outcome == 'success' || steps.browser-suite.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.job }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: packages/web/test-results/
          if-no-files-found: warn

  e2e-webkit-2:
    name: browser webkit (2/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install workspace packages
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      - name: Download pinned browser engines
        run: mise exec -- pnpm --filter @uberblick/web exec playwright install chromium webkit

      - name: Run browser suite
        id: browser-suite
        run: mise run e2e --project=webkit-ipad --shard=2/3

      - name: Upload browser results
        if: ${{ always() && (steps.browser-suite.outcome == 'success' || steps.browser-suite.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.job }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: packages/web/test-results/
          if-no-files-found: warn

  e2e-webkit-3:
    name: browser webkit (3/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install workspace packages
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      - name: Download pinned browser engines
        run: mise exec -- pnpm --filter @uberblick/web exec playwright install chromium webkit

      - name: Run browser suite
        id: browser-suite
        run: mise run e2e --project=webkit-ipad --shard=3/3

      - name: Upload browser results
        if: ${{ always() && (steps.browser-suite.outcome == 'success' || steps.browser-suite.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.job }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: packages/web/test-results/
          if-no-files-found: warn

  e2e-workload:
    name: browser workload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-

      - name: Install workspace packages
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      - name: Download pinned browser engines
        run: mise exec -- pnpm --filter @uberblick/web exec playwright install chromium webkit

      - name: Run browser suite
        id: browser-suite
        run: mise run e2e --project=chromium-workload --no-deps

      - name: Upload browser results
        if: ${{ always() && (steps.browser-suite.outcome == 'success' || steps.browser-suite.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.job }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: packages/web/test-results/
          if-no-files-found: warn

  # The workload project retains dependencies locally; --no-deps above puts
  # probes on separate hardware while interactive CI jobs execute in parallel.
  e2e:
    name: browser e2e
    needs: [e2e-chromium-1, e2e-chromium-2, e2e-chromium-3, e2e-webkit-1, e2e-webkit-2, e2e-webkit-3, e2e-workload]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped required check is accepted by rulesets, so reject every result
      # except success, including cancellation and skips in any browser job.
      - run: test '${{ needs.e2e-chromium-1.result }}' = success && test '${{ needs.e2e-chromium-2.result }}' = success && test '${{ needs.e2e-chromium-3.result }}' = success && test '${{ needs.e2e-webkit-1.result }}' = success && test '${{ needs.e2e-webkit-2.result }}' = success && test '${{ needs.e2e-webkit-3.result }}' = success && test '${{ needs.e2e-workload.result }}' = success
