name: Publish hub release

on:
  push:
    tags:
      - "hub-v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: hub-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.sender.type == 'User' && github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - name: Authenticate only with this workflow's token
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, scan and publish the immutable hub version
        run: mise run publish-hub-release -- "$GITHUB_REF_NAME"
