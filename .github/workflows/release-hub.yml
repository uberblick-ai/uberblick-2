name: Publish hub release

on:
  push:
    tags:
      - "hub-v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: hub-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event.sender.type == 'User' && github.event.sender.login != 'uberblick-agent' && github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v4
      - name: Enable the other Linux platform for runtime image stages
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Authenticate only with this workflow's token
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, scan and publish the immutable hub version
        id: publish
        run: mise run publish-hub-release -- "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest the hub index built by this run
        if: steps.publish.outputs.outcome == 'published'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/uberblick-ai/hub
          subject-digest: ${{ steps.publish.outputs.hub-digest }}
      - name: Attest the web index built by this run
        if: steps.publish.outputs.outcome == 'published'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/uberblick-ai/hub-web
          subject-digest: ${{ steps.publish.outputs.web-digest }}
      - name: Verify both published indexes have release provenance
        if: steps.publish.outputs.outcome == 'published'
        run: >-
          node scripts/release-attestation.mjs release-hub.yml "$GITHUB_REF_NAME" "$GITHUB_SHA"
          "oci://ghcr.io/uberblick-ai/hub@${{ steps.publish.outputs.hub-digest }}"
          "oci://ghcr.io/uberblick-ai/hub-web@${{ steps.publish.outputs.web-digest }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assets:
    needs: publish
    if: github.event.sender.type == 'User' && github.event.sender.login != 'uberblick-agent' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: hub-release-assets
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Authenticate to inspect the published images
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the immutable Docker Compose downloads
        run: node scripts/publish-hub-release-assets.mjs "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
